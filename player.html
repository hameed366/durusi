<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>مشغّل دروسي</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{display:grid;place-items:center;height:100%;margin:0}
</style>
</head>
<body>
<script>
// صفحة وسيطة لتشغيل فيديو يوتيوب داخل تطبيق الآيفون (تتجنب خطأ 153)
var v=new URLSearchParams(location.search).get('v')||'';
if(/^[\w-]{6,20}$/.test(v)){
  var f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+v+'?rel=0&modestbranding=1&playsinline=1';
  f.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.title='فيديو الدرس';
  document.body.appendChild(f);
}else{
  document.body.innerHTML='<p>رابط الفيديو غير صحيح</p>';
}
</script>
</body>
</html>
