<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دروسي</title>
<meta name="theme-color" content="#061c24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دروسي">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone-first app shell, 520px column, fixed glass bottom nav; deep indigo night with violet glow */
:root{
  --ok:#34d399;
  --display:"Alexandria","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
/* skins */
:root{--bg:#061c24;--bg2:#0b3a44;--panel:#0e2b35;--panel2:#123744;--line:#21505d;--fg:#eef8f7;--muted:#97b8bf;--accent:#f5a524;--accent2:#14b8a6;--accent-hi:#fcd34d;--on-accent:#2a1a00;--gold-grad:linear-gradient(135deg,#fcd34d,#f59e0b);--prim-grad:linear-gradient(90deg,#0d9488,#14b8a6);--glow1:#0f5a5e;--glow2:#0b4450;--bgEnd:#08242d;--accent-soft:rgba(245,165,36,.10);--accent-glow:rgba(245,165,36,.3);--track:#1d4552;--deep:#04161d;--card:#0b2530;--soft:#cfe3e3;--shade:rgba(3,18,24,.45);--chip:#163f4c;--open-bg:#0f766e;--open-line:#2dd4bf;--lesson-bg:rgba(2,30,32,.4);--lesson-sub:#ccfbf1;--input:#082630;--veil:rgba(1,10,14,.65);--sheet:#0c2c36;--grip:#2f6573;--nav:rgba(9,60,70,.6);--navtx:#a7c9cf}
:root[data-skin="royal"]{--bg:#0e0a2a;--bg2:#2a1660;--panel:#1a1442;--panel2:#221a52;--line:#3a2f78;--fg:#f4f1ff;--muted:#b0a8de;--accent:#f472b6;--accent2:#a855f7;--accent-hi:#f9a8d4;--on-accent:#3b0420;--gold-grad:linear-gradient(135deg,#f9a8d4,#ec4899);--prim-grad:linear-gradient(90deg,#6d28d9,#a855f7);--glow1:#4c1d95;--glow2:#831843;--bgEnd:#130d33;--accent-soft:rgba(244,114,182,.10);--accent-glow:rgba(236,72,153,.35);--track:#2e2560;--deep:#120d30;--card:#150f38;--soft:#ddd6fe;--shade:rgba(10,6,30,.45);--chip:#2a2163;--open-bg:#5b21b6;--open-line:#a78bfa;--lesson-bg:rgba(20,6,50,.4);--lesson-sub:#ede9fe;--input:#120d30;--veil:rgba(5,3,18,.65);--sheet:#1a1442;--grip:#4b3f8f;--nav:rgba(50,30,110,.6);--navtx:#c4b5fd}
:root[data-skin="sunset"]{--bg:#1c0b12;--bg2:#3b1322;--panel:#2a121c;--panel2:#341824;--line:#5a2a3a;--fg:#fff3ee;--muted:#d8a9a6;--accent:#fb923c;--accent2:#f43f5e;--accent-hi:#fdba74;--on-accent:#3a1300;--gold-grad:linear-gradient(135deg,#fdba74,#f97316);--prim-grad:linear-gradient(90deg,#e11d48,#f97316);--glow1:#9f1239;--glow2:#7c2d12;--bgEnd:#210c14;--accent-soft:rgba(251,146,60,.10);--accent-glow:rgba(249,115,22,.35);--track:#4a2230;--deep:#180910;--card:#22101a;--soft:#fde2d8;--shade:rgba(20,5,10,.45);--chip:#43202d;--open-bg:#be123c;--open-line:#fb7185;--lesson-bg:rgba(40,5,15,.35);--lesson-sub:#ffe4e6;--input:#1a0a10;--veil:rgba(15,3,8,.65);--sheet:#2a121c;--grip:#6a3446;--nav:rgba(90,25,45,.6);--navtx:#f4b6b0}
:root[data-skin="ocean"]{--bg:#031329;--bg2:#0a2a55;--panel:#0a1f40;--panel2:#0f284f;--line:#1e4378;--fg:#eef6ff;--muted:#9fb9dc;--accent:#22d3ee;--accent2:#3b82f6;--accent-hi:#67e8f9;--on-accent:#032a33;--gold-grad:linear-gradient(135deg,#67e8f9,#06b6d4);--prim-grad:linear-gradient(90deg,#2563eb,#06b6d4);--glow1:#1e3a8a;--glow2:#0e5a7a;--bgEnd:#041a36;--accent-soft:rgba(34,211,238,.10);--accent-glow:rgba(6,182,212,.35);--track:#18375f;--deep:#031024;--card:#071a36;--soft:#d6e8ff;--shade:rgba(2,10,25,.45);--chip:#133463;--open-bg:#1d4ed8;--open-line:#60a5fa;--lesson-bg:rgba(2,12,40,.4);--lesson-sub:#dbeafe;--input:#04152e;--veil:rgba(1,6,16,.65);--sheet:#0a1f40;--grip:#2d5590;--nav:rgba(15,45,100,.6);--navtx:#a5c4ec}
:root[data-skin="gold"]{--bg:#0f0d0a;--bg2:#2a2214;--panel:#1b1812;--panel2:#231f17;--line:#3d3424;--fg:#fbf6ea;--muted:#bfb294;--accent:#e9b949;--accent2:#c9962b;--accent-hi:#f5d77e;--on-accent:#2b1f00;--gold-grad:linear-gradient(135deg,#f5d77e,#c9962b);--prim-grad:linear-gradient(90deg,#a16207,#d4a133);--glow1:#4a3a14;--glow2:#2e2410;--bgEnd:#12100b;--accent-soft:rgba(233,185,73,.08);--accent-glow:rgba(233,185,73,.3);--track:#3a3222;--deep:#0c0a07;--card:#16130e;--soft:#efe4c8;--shade:rgba(10,8,4,.5);--chip:#2c261a;--open-bg:#7a5a12;--open-line:#e9b949;--lesson-bg:rgba(15,10,0,.35);--lesson-sub:#fef3c7;--input:#12100b;--veil:rgba(5,4,2,.7);--sheet:#1b1812;--grip:#5a4c30;--nav:rgba(45,38,22,.65);--navtx:#d6c79f}
:root[data-skin="aurora"]{--bg:#0b1220;--bg2:#1a2440;--panel:#121a30;--panel2:#18223c;--line:#2a3a5c;--fg:#f0f7ff;--muted:#a8b6d4;--accent:#6ee7b7;--accent2:#34d399;--accent-hi:#a7f3d0;--on-accent:#032b1e;--gold-grad:linear-gradient(135deg,#a7f3d0,#34d399);--prim-grad:linear-gradient(90deg,#8b5cf6,#10b981);--glow1:#065f46;--glow2:#6b21a8;--bgEnd:#0c1426;--accent-soft:rgba(110,231,183,.08);--accent-glow:rgba(52,211,153,.3);--track:#25335a;--deep:#090f1c;--card:#0f172b;--soft:#dbe4f5;--shade:rgba(5,8,18,.45);--chip:#1f2c4d;--open-bg:#5b3fd0;--open-line:#a78bfa;--lesson-bg:rgba(5,5,30,.35);--lesson-sub:#e9e5ff;--input:#0a1020;--veil:rgba(3,5,12,.65);--sheet:#121a30;--grip:#3a4b78;--nav:rgba(30,40,80,.6);--navtx:#b8c4e4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--fg);background:var(--bg);
  background-image:radial-gradient(120% 60% at 90% 0%,var(--glow1) 0%,transparent 55%),radial-gradient(90% 50% at 0% 100%,var(--glow2) 0%,transparent 60%),linear-gradient(180deg,var(--bg) 0%,var(--bgEnd) 100%);
  background-attachment:fixed;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.iconbtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* header */
.hello{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#0ea5a4);display:grid;place-items:center;font:800 26px var(--display);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.hello .who{flex:1;min-width:0}
.hello h1{font-size:22px}
.tag{color:var(--ok);font-weight:700;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px;gap:10px}
.sec-head h2{font-size:20px}
.pill-btn{color:var(--on-accent);background:var(--gold-grad);border-radius:999px;padding:8px 18px;font-weight:800;font-family:var(--display);font-size:14px;box-shadow:0 6px 20px var(--accent-glow)}

/* continue banner */
.cont{margin-top:20px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--accent);border-radius:20px;background:var(--accent-soft);padding:12px 14px;width:100%;text-align:right}
.cont .disc{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--track) 0);display:grid;place-items:center;flex:none}
.cont .disc span{width:38px;height:38px;border-radius:50%;background:var(--deep);display:grid;place-items:center}
.cont .disc svg{width:18px;height:18px;fill:#fff}
.cont .t{flex:1;min-width:0}
.cont b{font-family:var(--display);display:block}
.cont small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* subject grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scard{position:relative;overflow:hidden;border-radius:22px;padding:14px;min-height:178px;text-align:right;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--card)) 0%,var(--card) 85%);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.scard:active{transform:scale(.98)}
.scard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;position:relative;z-index:1}
.sicon{width:42px;height:42px;border-radius:12px;background:var(--c);display:grid;place-items:center;flex:none}
.sicon svg{width:22px;height:22px;color:#fff}
.badge{font-size:12px;font-weight:700;border:1px solid rgba(52,211,153,.5);border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);white-space:nowrap}
.badge i{width:14px;height:14px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.badge i svg{width:10px;height:10px;color:#062}
.scard h3{font-size:17px;position:relative;z-index:1;line-height:1.35}
.scard .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:8px;position:relative;z-index:1}
.scard .bar span{display:block;height:100%;border-radius:9px;background:var(--c)}
.scard small{position:relative;z-index:1;color:var(--muted);font-size:12px}
.sphere{position:absolute;left:-26px;bottom:-26px;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),color-mix(in srgb,var(--c) 30%,transparent) 45%,rgba(0,0,0,.2) 100%);border:1px solid rgba(255,255,255,.15);display:grid;place-items:center}
.sphere svg{width:56px;height:56px;color:color-mix(in srgb,var(--c) 70%,#fff);opacity:.75}

/* subject page */
.topbar{display:flex;gap:10px;align-items:stretch}
.topbar .cont{margin-top:0;width:auto;flex:1;min-width:0}
.hero{margin-top:18px;border-radius:26px;border:1px solid var(--line);padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--panel)) 0%,var(--panel) 100%);position:relative;overflow:hidden}
.hero .sphere{left:auto;right:auto;inset-inline-start:auto;left:50%;top:30px;transform:translateX(-50%);width:200px;height:200px;opacity:.35}
.hero .sphere svg{width:96px;height:96px}
.hero > *{position:relative}
.hero .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero h1{font-size:26px}
.hero p{color:var(--soft);margin:10px 0 16px}
.teacher{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;padding:10px;background:var(--shade)}
.tav{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 22px var(--display);background:linear-gradient(135deg,var(--c),var(--bg2));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 60%,#fff)}
.teacher .t{flex:1;min-width:0}
.teacher b{font-family:var(--display);font-size:17px;display:block}
.teacher small{color:var(--muted);display:block;font-size:13px;line-height:1.4}
.teacher .iconbtn{width:42px;height:42px;border-radius:50%}
.tabs{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;border-radius:22px;border:1px solid var(--line);background:var(--shade)}
.tabs button{padding:12px;border-radius:17px;font:800 20px var(--display);color:var(--muted);background:rgba(255,255,255,.04)}
.tabs button[aria-selected="true"]{color:#fff;background:var(--prim-grad)}
.quick{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:15px}
.quick .q{width:58px;height:58px;border-radius:50%;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center}
.quick .q svg{width:26px;height:26px;color:var(--accent-hi)}

.unit{border:1px solid var(--line);border-radius:22px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.unit.open{border-color:var(--open-line);background:var(--open-bg)}
.uhead{display:flex;align-items:center;gap:12px;padding:16px;width:100%;text-align:right}
.uhead .chev{width:22px;height:22px;transition:transform .2s;flex:none}
.unit.open .chev{transform:rotate(180deg)}
.uhead .t{flex:1;min-width:0}
.uhead b{font-family:var(--display);font-size:19px;display:block;line-height:1.4}
.uhead small{font-weight:700}
.ring{width:60px;height:60px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.lessons{padding:0 10px 12px;display:grid;gap:8px}
.lesson{display:flex;align-items:center;gap:10px;background:var(--lesson-bg);border-radius:16px;padding:10px 12px;width:100%;text-align:right}
.lesson .lt{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.lesson .lt svg{width:18px;height:18px}
.lesson .t{flex:1;min-width:0;line-height:1.35}
.lesson small{color:var(--lesson-sub);font-size:12px}
.lesson .done{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none}
.lesson .done.on{background:var(--ok);border-color:var(--ok)}
.lesson .done svg{width:14px;height:14px;color:#053}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 10px 12px}
.ghost{border:1px dashed rgba(255,255,255,.4);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}
.ghost.danger{border-color:#f87171;color:#fecaca}

/* lesson page */
.player{margin-top:16px;aspect-ratio:16/9;max-width:100%;border-radius:22px;background:radial-gradient(circle at 70% 30%,color-mix(in srgb,var(--c) 55%,transparent),transparent 60%),var(--deep);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:16px}
.player .pb{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto 10px}
.player .pb svg{width:30px;height:30px;fill:#fff}
.player a{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 16px;font-weight:800;font-family:var(--display);font-size:15px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--prim-grad);border:0}
.btn.okb{background:var(--ok);color:#043b2a;border:0}
.btn svg{width:18px;height:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:16px;margin-top:14px}

/* lists */
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:12px 14px;margin-bottom:10px;width:100%;text-align:right}
.item .t{flex:1;min-width:0}
.item b{display:block;font-family:var(--display);font-size:15px}
.item small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:20px}
.pbar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:6px}
.pbar span{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent))}

/* quiz */
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;background:var(--panel2);font-weight:700}
.opt.right{background:rgba(52,211,153,.2);border-color:var(--ok)}
.opt.wrong{background:rgba(248,113,113,.18);border-color:#f87171}

/* schedule */
.day h3{font-size:16px;margin:18px 0 8px;color:var(--accent-hi)}
.slot{display:flex;gap:12px;align-items:center;border-radius:16px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;border-inline-start:4px solid var(--c)}
.slot .time{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.slot .t{flex:1;min-width:0}

/* form + sheet */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--soft)}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--track);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{right:25px}
.veil{position:fixed;inset:0;background:var(--veil);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:19px;margin-bottom:6px}
.grip{width:44px;height:5px;border-radius:9px;background:var(--grip);margin:0 auto 14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.grades button{padding:14px 0;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font:800 18px var(--display)}
.grades button.on{color:var(--on-accent);background:var(--gold-grad);border-color:transparent}
.toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:var(--bg);font-weight:800;padding:10px 18px;border-radius:99px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-radius:26px;border:1px solid rgba(255,255,255,.14);background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--navtx);font-weight:700;font-family:var(--display);font-size:13px;border-radius:18px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:#fff;background:rgba(255,255,255,.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stats b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
@media (max-width:370px){.grid{gap:10px}.scard h3{font-size:15px}.quick button{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{-webkit-tap-highlight-color:transparent}
.app{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.player.embed{padding:0;overflow:hidden;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.ylink{display:block;text-align:center;margin-top:8px;color:var(--muted);font-size:14px}
.install{margin-top:20px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:12px 14px}
.install .t{flex:1;min-width:0}
/* magic */
#magic{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
body{transition:background-color .5s}
.scard::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%);transform:translateX(130%);transition:transform .8s ease}
.scard:hover::after,.scard:active::after{transform:translateX(-130%)}
.cont{position:relative;overflow:hidden;box-shadow:0 0 24px var(--accent-soft)}
.cont::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(120%);animation:sheen 5s ease-in-out infinite 1s}
@keyframes sheen{0%,60%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.pill-btn{animation:glowp 3.2s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 6px 28px var(--accent-glow),0 0 0 4px var(--accent-soft)}}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.skin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
.skin .dot{width:54px;height:54px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.35);position:relative}
.skin .dot::after{content:"✦";position:absolute;top:6px;right:9px;font-size:13px;color:#fff;opacity:.9}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 0 22px var(--accent-glow)}
@media (prefers-reduced-motion:reduce){.cont::after,.pill-btn{animation:none}.scard::after{display:none}}
</style>

  case 'sem':V.sem=+el.dataset.v;V.open=null;render();break;
  case 'unit':V.open=V.open===el.dataset.id?null:el.dataset.id;V.confirm=null;render();break;
  case 'lesson':{const s=el.dataset.s,id=el.dataset.id;const f=findLesson(s,id);S.last={grade:S.grade,subj:s,id};save();go('lesson',{subj:s,lesson:id,sem:f?f.sem:V.sem,open:f?f.unit.id:V.open});break}
  case 'done':{const k=S.grade+'|'+V.lesson;if(S.done[k])delete S.done[k];else{S.done[k]=1;burst(e.clientX,e.clientY,40);toast('أحسنت! تم تسجيل الدرس كمكتمل ✦')}save();const la=document.getElementById('lact');if(la)la.innerHTML=lessonActs();else render();break}
  case 'mark':{const k=S.grade+'|'+V.lesson;if(S.marks[k])delete S.marks[k];else{S.marks[k]=1;toast('تم الحفظ في مرجعك')}save();const la2=document.getElementById('lact');if(la2)la2.innerHTML=lessonActs();else render();break}
  case 'notes':notesSheet();break;
  case 'marks':marksSheet();break;
  case 'quiz':case 'quizRe':V.quiz={i:0,score:0,pick:null};quizSheet();break;
  case 'qpick':{if(V.quiz.pick!=null)return;const i=+el.dataset.i;V.quiz.pick=i;if(i===(QB[sid]||QB.math)[V.quiz.i][2]){V.quiz.score++;burst(e.clientX,e.clientY,26)}quizSheet();break}
  case 'qnext':V.quiz.i++;V.quiz.pick=null;V.quiz.order=null;quizSheet();break;
  case 'tinfo':{const T=teacherOf(sid);sheet(`<h2>${esc(T.name)}</h2><p class="muted">معلم ${SUBJ[sid].name} – الصف ${S.grade}</p><div class="card"><b>المؤهل العلمي</b><p style="margin:4px 0 0">${esc(T.qual)}</p></div>`);break}
  case 'editT':{const T=teacherOf(sid);sheet(`<h2>بيانات المعلم</h2><form id="tf"><label for="tn">الاسم</label><input id="tn" value="${esc(T.name)}"><label for="tq">المؤهل العلمي</label><input id="tq" value="${esc(T.qual)}"><button class="btn primary" style="width:100%;margin-top:16px">حفظ</button></form>`);break}
  case 'grade':sheet(`<h2>اختر مرحلتك</h2><p class="muted" style="margin:0">تتغيّر المواد والمحتوى حسب الصف</p><div class="grades">${[6,7,8,9,10,11,12].map(g=>`<button class="${g===S.grade?'on':''}" data-act="setG" data-v="${g}">${g}</button>`).join('')}</div>`);break;
  case 'setG':S.grade=+el.dataset.v;save();go('home');toast('تم التبديل إلى الصف '+S.grade);break;
  case 'toast':toast(el.dataset.m);break;
  case 'skins':sheet(`<h2>ألوان المنصة ✦</h2><p class="muted" style="margin:0">اختر الثيم اللي يعجبك</p>${skinGrid()}`);break;
  case 'skin':{S.skin=el.dataset.v;save();applySkin();const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,34);document.querySelectorAll('.skin').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.skin));if(V.view==='account')render();break}
  case 'tmode':if(S.teacher){S.teacher=false;save();render();toast('تم إيقاف وضع المعلم')}else sheet(`<h2>وضع المعلم</h2><form id="pf"><label for="pin">الرقم السري</label><input id="pin" type="password" inputmode="numeric" required><p id="perr" class="muted" hidden style="color:#fca5a5">الرقم السري غير صحيح</p><button class="btn primary" style="width:100%;margin-top:16px">دخول</button></form>`);break;
  case 'copyJson':{const txt=JSON.stringify({custom:Object.assign({},PUB.custom,S.custom),teachers:Object.assign({},PUB.teachers,S.teachers)});const fb=()=>{sheet(`<h2>انسخ المحتوى</h2><p class="muted" style="margin:0 0 8px">حدّد النص كله وانسخه، ثم الصقه في ملف content.json على GitHub.</p><textarea id="jtxt" rows="8" dir="ltr" readonly>${esc(txt)}</textarea>`);const t=document.getElementById('jtxt');t.focus();t.select()};try{navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ – الصقه في content.json على GitHub'),fb)}catch(e){fb()}break}
  case 'export':{const data={custom:Object.assign({},PUB.custom,S.custom),teachers:Object.assign({},PUB.teachers,S.teachers)};const b=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='content.json';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل content.json');break}
  case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}else sheet(`<h2>تثبيت التطبيق</h2><div class="card"><b>آيفون (Safari)</b><p style="margin:4px 0 0">اضغط زر المشاركة <b>⬆</b> أسفل الشاشة، ثم «إضافة إلى الشاشة الرئيسية».</p></div><div class="card"><b>أندرويد (Chrome)</b><p style="margin:4px 0 0">اضغط القائمة ⋮ أعلى الشاشة، ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p></div>`);break;
  case 'saveAcc':{S.name=document.getElementById('nm').value.trim()||S.name;S.grade=+document.getElementById('gr').value;save();render();toast('تم الحفظ');break}
  case 'reset':if(V.confirm!=='reset'){V.confirm='reset';render();break}Object.keys(S.done).filter(k=>k.startsWith(S.grade+'|')).forEach(k=>delete S.done[k]);Object.keys(S.marks).filter(k=>k.startsWith(S.grade+'|')).forEach(k=>delete S.marks[k]);if(S.last&&S.last.grade===S.grade)S.last=null;save();V.confirm=null;render();toast('تمت إعادة الضبط');break;
  case 'addU':sheet(`<h2>وحدة جديدة</h2><form id="uf"><label for="ut">اسم الوحدة</label><input id="ut" required placeholder="مثال: الوحدة الرابعة – الدوال"><button class="btn primary" style="width:100%;margin-top:16px">إضافة</button></form>`);V.formU=null;break;
  case 'renU':{const u=editable(sid)[V.sem].find(x=>x.id===el.dataset.u);V.formU=u.id;sheet(`<h2>إعادة تسمية الوحدة</h2><form id="uf"><label for="ut">اسم الوحدة</label><input id="ut" required value="${esc(u.title)}"><button class="btn primary" style="width:100%;margin-top:16px">حفظ</button></form>`);break}
  case 'delU':{const id=el.dataset.u;if(V.confirm!=='u'+id){V.confirm='u'+id;render();break}const C=editable(sid);C[V.sem]=C[V.sem].filter(x=>x.id!==id);save();V.confirm=null;render();toast('تم حذف الوحدة');break}
  case 'addL':V.formL={u:el.dataset.u,id:null};lessonForm(null);break;
  case 'editL':{const f=findLesson(sid,V.lesson);V.formL={u:f.unit.id,id:V.lesson};lessonForm(f.lesson);break}
  case 'delL':{if(V.confirm!=='l'+V.lesson){V.confirm='l'+V.lesson;render();break}const C=editable(sid);C[V.sem].forEach(u=>u.lessons=u.lessons.filter(l=>l.id!==V.lesson));save();go('subject');toast('تم حذف الدرس');break}
  case 'addSlot':{const subs=subjectsFor(S.grade);sheet(`<h2>موعد مذاكرة</h2><form id="sf"><label for="sd">اليوم</label><select id="sd">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><label for="st">الوقت</label><input id="st" type="time" value="16:00" required><label for="ss">المادة</label><select id="ss">${subs.map(s=>`<option value="${s}">${SUBJ[s].name}</option>`).join('')}</select><label for="sn">ملاحظة</label><input id="sn" placeholder="مثال: حل تمارين الوحدة الأولى"><button class="btn primary" style="width:100%;margin-top:16px">إضافة</button></form>`);break}
  case 'delSlot':{const k=+el.dataset.k;if(V.confirm!=='s'+k){V.confirm='s'+k;render();break}S.schedule.splice(k,1);save();V.confirm=null;render();break}
 }
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,sid=V.subj,$=id=>document.getElementById(id).value.trim();
 if(f.id==='uf'){const C=editable(sid);if(V.formU){C[V.sem].find(x=>x.id===V.formU).title=$('ut')}else{const id='c'+Date.now();C[V.sem].push({id,title:$('ut'),lessons:[]});V.open=id}V.formU=null;save();closeSheet();render()}
 if(f.id==='lf'){const C=editable(sid);const u=C[V.sem].find(x=>x.id===V.formL.u)||C[1].concat(C[2]).find(x=>x.id===V.formL.u);const data={title:$('lt'),type:$('ly'),dur:$('ld'),url:$('lu')};
  if(V.formL.id){Object.assign(u.lessons.find(l=>l.id===V.formL.id),data)}else u.lessons.push({id:'c'+Date.now(),...data});save();closeSheet();render();toast('تم حفظ الدرس')}
 if(f.id==='pf'){if($('pin')===TEACHER_PIN){S.teacher=true;save();closeSheet();render();toast('تم تفعيل وضع المعلم')}else document.getElementById('perr').hidden=false}
 if(f.id==='wf'){S.name=$('wn');S.grade=+$('wg');save();closeSheet();render()}
 if(f.id==='tf'){S.teachers[ckey(sid)]={name:$('tn'),qual:$('tq')};save();closeSheet();render()}
 if(f.id==='sf'){S.schedule.push({day:+$('sd'),time:$('st'),subj:$('ss'),note:$('sn')});save();closeSheet();render();toast('تمت إضافة الموعد')}
});
/* ---------- magic ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.createElement('canvas');cv.id='magic';document.body.prepend(cv);
const cx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1),COL=['#fff','#fcd34d'];
const stars=[],sparks=[];
function size(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
for(let i=0;i<38;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,s:Math.random()*.25+.05,t:Math.random()*6.28,k:Math.random()<.5?0:1});
function star4(x,y,r){cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function burst(x,y,n){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*5+2;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,r:Math.random()*5+3,k:i%3?1:0})}if(!running)loop()}
let running=false;
function loop(){running=true;cx.clearRect(0,0,W,H);
 for(const s of stars){s.t+=.03;s.y-=s.s;if(s.y<-5){s.y=H+5;s.x=Math.random()*W}cx.globalAlpha=.25+.45*Math.abs(Math.sin(s.t));cx.fillStyle=COL[s.k];s.r>1.4?star4(s.x,s.y,s.r*2.4):(cx.beginPath(),cx.arc(s.x,s.y,s.r,0,6.28),cx.fill())}
 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.98;p.life-=.02;if(p.life<=0){sparks.splice(i,1);continue}cx.globalAlpha=p.life;cx.fillStyle=COL[p.k];star4(p.x,p.y,p.r*p.life+1)}
 cx.globalAlpha=1;if(RM&&!sparks.length){running=false;return}requestAnimationFrame(loop)}
function applySkin(){const r=document.documentElement;r.dataset.skin=S.skin||'emerald';const cs=getComputedStyle(r);COL=[cs.getPropertyValue('--accent-hi').trim()||'#fff',cs.getPropertyValue('--fg').trim()||'#fff'];const m=document.querySelector('meta[name=theme-color]');if(m)m.content=cs.getPropertyValue('--bg').trim()}
applySkin();loop();
function standalone(){return NATIVE||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function welcome(){if(S.name)return;sheet(`<h2>أهلاً بك في دروسي</h2><p class="muted" style="margin:0">اكتب اسمك واختر صفك للبدء</p><form id="wf"><label for="wn">الاسم</label><input id="wn" required><label for="wg">الصف</label><select id="wg">${[6,7,8,9,10,11,12].map(g=>`<option value="${g}" ${g===10?'selected':''}>الصف ${g}</option>`).join('')}</select><button class="btn primary" style="width:100%;margin-top:16px">ابدأ</button></form>`)}
render();
fetch(siteLink('content.json'),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d){PUB={custom:d.custom||{},teachers:d.teachers||{}};render()}}).catch(()=>{}).finally(welcome);
</script>
